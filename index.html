<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан Доска</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-tasks"></i> Канбан Доска</h1>
            <div class="header-controls">
                <!-- Панель поиска и фильтров -->
                <div class="search-filters">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Поиск задач...">
                    </div>
                    <div class="filter-controls">
                        <select id="statusFilter">
                            <option value="all">Все статусы</option>
                            <option value="todo">К выполнению</option>
                            <option value="in-progress">В процессе</option>
                            <option value="done">Готово</option>
                        </select>
                        <select id="priorityFilter">
                            <option value="all">Все приоритеты</option>
                            <option value="high">Высокий</option>
                            <option value="medium">Средний</option>
                            <option value="low">Низкий</option>
                        </select>
                        <select id="dueDateFilter">
                            <option value="all">Все сроки</option>
                            <option value="overdue">Просроченные</option>
                            <option value="today">Сегодня</option>
                            <option value="week">На этой неделе</option>
                            <option value="no-date">Без срока</option>
                        </select>
                    </div>
                </div>

                <!-- Кнопки управления -->
                <div class="control-buttons">
                    <button id="toggleThemeBtn" class="btn btn-secondary" title="Переключить тему">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="exportBtn" class="btn btn-secondary" title="Экспорт данных">
                        <i class="fas fa-download"></i>
                    </button>
                    <button id="archiveBtn" class="btn btn-secondary" title="Архив задач">
                        <i class="fas fa-archive"></i>
                    </button>
                    <button id="addTaskBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Добавить задачу
                    </button>
                </div>
            </div>
        </header>

        <div class="kanban-board">
            <div class="column" data-status="todo">
                <div class="column-header">
                    <h3><i class="fas fa-list"></i> К выполнению</h3>
                    <span class="task-count">0</span>
                </div>
                <div class="task-list" id="todo">
                    <!-- Задачи будут добавляться сюда -->
                </div>
                <button class="add-task-btn" data-column="todo">
                    <i class="fas fa-plus"></i> Добавить задачу
                </button>
            </div>

            <div class="column" data-status="in-progress">
                <div class="column-header">
                    <h3><i class="fas fa-spinner"></i> В процессе</h3>
                    <span class="task-count">0</span>
                </div>
                <div class="task-list" id="in-progress">
                    <!-- Задачи будут добавляться сюда -->
                </div>
                <button class="add-task-btn" data-column="in-progress">
                    <i class="fas fa-plus"></i> Добавить задачу
                </button>
            </div>

            <div class="column" data-status="done">
                <div class="column-header">
                    <h3><i class="fas fa-check-circle"></i> Готово</h3>
                    <span class="task-count">0</span>
                </div>
                <div class="task-list" id="done">
                    <!-- Задачи будут добавляться сюда -->
                </div>
                <button class="add-task-btn" data-column="done">
                    <i class="fas fa-plus"></i> Добавить задачу
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования задачи -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить задачу</h2>
                <span class="close">&times;</span>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Название задачи:</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Описание:</label>
                    <textarea id="taskDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="taskPriority">Приоритет:</label>
                    <select id="taskPriority">
                        <option value="low">Низкий</option>
                        <option value="medium" selected>Средний</option>
                        <option value="high">Высокий</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskDueDate">Срок выполнения:</label>
                    <input type="date" id="taskDueDate">
                </div>
                <div class="form-group">
                    <label for="taskStatus">Статус:</label>
                    <select id="taskStatus">
                        <option value="todo">К выполнению</option>
                        <option value="in-progress">В процессе</option>
                        <option value="done">Готово</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
